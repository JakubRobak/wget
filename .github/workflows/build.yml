name: Build Wget

on:
  push:
    branches:
      - ino_dev

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            build-essential \
            autoconf \
            automake \
            autopoint \
            gettext \
            texinfo \
            flex \
            gperf \
            libssl-dev \
            libgnutls28-dev \
            zlib1g-dev \
            pkg-config \
            wget \
            ca-certificates \
            autoconf-archive \
            bison

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bootstrap
        run: ./bootstrap

      - name: Configure
        run: ./configure --with-ssl=openssl

      - name: Build
        run: make -j$(nproc)

      - name: Upload wget binary
        uses: actions/upload-artifact@v4
        with:
          name: wget-binary
          path: src/wget
