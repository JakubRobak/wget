name: Build Wget

on:
  push:
    branches:
      - ino_dev

jobs:
  build:
    name: Build and Upload Wget
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark working directory as safe for Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            automake \
            autoconf \
            autopoint \
            gettext \
            texinfo \
            flex \
            bison \
            gperf \
            libssl-dev \
            libgnutls28-dev \
            zlib1g-dev \
            pkg-config \
            git \
            ca-certificates \
            autoconf-archive \
            wget

      - name: Run bootstrap script
        run: ./bootstrap

      - name: Configure the build
        run: ./configure --with-ssl=openssl

      - name: Build wget
        run: make -j$(nproc)

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: wget-binary
          path: src/wget
